<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Aganze NetworkTalent Platform logo</title>
  <desc id="desc">Circular logo with a person in a straw hat working on a laptop and text around the ring.</desc>
  <rect width="600" height="600" fill="#f7f5f0"/>

  <g transform="translate(300 300)">
    <circle r="240" fill="none" stroke="#123c35" stroke-width="8"/>
    <path d="M-194 0A194 194 0 0 1 194 0" fill="none" stroke="#123c35" stroke-width="14" stroke-linecap="round" stroke-dasharray="8 18" transform="rotate(0)"/>

    <circle r="150" fill="#f0c76b"/>
    <path d="M -130 0 A130 130 0 1 1 130 0" fill="none" stroke="#f0c76b" stroke-width="8" opacity="0.8"/>

    <g transform="translate(0,4)">
      <path d="M-108 50 L -42 -68 L 42 -68 L 108 50 Z" fill="#dfb74d"/>
      <path d="M-125 60 Q0 -120 125 60" fill="none" stroke="#d59a2f" stroke-width="15" stroke-linecap="round"/>
      <path d="M-120 60 Q0 -105 120 60" fill="none" stroke="#e6bb51" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
      <path d="M-90 58 C-72 18, 72 18, 90 58 L 90 80 Q0 100 -90 80 Z" fill="#f3c66c"/>

      <g transform="translate(0,20)">
        <path d="M-110 95 Q0 10 110 95 L110 160 Q0 208 -110 160 Z" fill="#1d4d45"/>
        <path d="M-88 98 Q0 40 88 98 L88 156 Q0 182 -88 156 Z" fill="#2e6b5c" opacity="0.7"/>

        <circle cx="-52" cy="-6" r="16" fill="#2b1c15"/>
        <circle cx="52" cy="-6" r="16" fill="#2b1c15"/>
        <circle cx="-52" cy="-2" r="6" fill="#fff"/>
        <circle cx="52" cy="-2" r="6" fill="#fff"/>
        <path d="M-32 28 Q0 52 32 28" fill="none" stroke="#5b2d20" stroke-width="8" stroke-linecap="round"/>
        <path d="M-18 60 Q0 75 18 60" fill="none" stroke="#5b2d20" stroke-width="6" stroke-linecap="round"/>
      </g>

      <g transform="translate(0,34)">
        <rect x="-78" y="80" width="156" height="92" rx="10" fill="#1b1b1d"/>
        <rect x="-64" y="94" width="128" height="62" rx="8" fill="#f0f1ef"/>
        <rect x="-40" y="167" width="80" height="20" rx="8" fill="#f0f1ef" opacity="0.7"/>
