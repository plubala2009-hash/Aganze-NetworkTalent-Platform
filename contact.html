<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Aganze</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="AGANZE LOGO.png" alt="Aganze"><span class="brand-text" data-i18n="brand-text">Aganze NetworkTalent Platform</span></a>
    <nav>
      <a href="index.html">Home</a>
      <button id="lang-toggle" class="button small">FR</button>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <h1>Contact</h1>
      <p>If you have questions or need support, send us a message.</p>
    </section>

    <section class="section">
      <form id="contact-form" method="post" action="#">
        <label>Name<input name="name" type="text" required data-i18n-placeholder="nav.contact"></label>
        <label>Email<input name="email" type="email" required placeholder="you@example.com"></label>
        <label>Message<textarea name="message" rows="6" required></textarea></label>
        <button class="button" type="submit" data-i18n="button.send">Send message</button>
      </form>
    </section>
  </main>
  <footer><p data-i18n="footer.copyright">© 2026 Aganze NetworkTalent Platform</p></footer>
  <script src="js/i18n.js"></script>
</body>
</html>
