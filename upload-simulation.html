<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upload a simulation to Aganze NetworkTalent Platform.">
  <meta name="theme-color" content="#123c35">
  <title>Upload simulation | Aganze NetworkTalent Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Aganze NetworkTalent Platform home">
      <img class="brand-logo" src="AGANZE LOGO.png" alt="Aganze NetworkTalent Platform logo">
    </a>
    <button class="menu-toggle" aria-label="Open menu">☰</button>
    <nav>
      <a href="about.html">About</a>
      <a href="how-it-works.html">How it works</a>
      <a href="talent-feed.html">Explore talent</a>
      <a href="contact.html">Contact</a>
      <a class="nav-login" href="login.html">Log in</a>
      <a class="button small" href="signup.html">Join free</a>
    </nav>
  </header>

  <main>
    <section class="page-hero narrow">
      <p class="eyebrow">UPLOAD WORK</p>
      <h1>Showcase a simulation or project.</h1>
    </section>

    <section class="section">
      <form class="auth-form">
        <label>
          Project title
          <input type="text" placeholder="e.g. Data cleanup workflow">
        </label>
        <label>
          Category
          <input type="text" placeholder="e.g. Cybersecurity, product design, data analysis">
        </label>
        <label>
          Description
          <textarea rows="5" placeholder="Describe the project, the result, and the skills used."></textarea>
        </label>
        <label>
          Upload file
          <input type="file">
        </label>
        <button class="button" type="submit">Publish evidence</button>
      </form>
    </section>
  </main>

  <footer>
    <span>© 2026 Aganze NetworkTalent Platform</span>
    <div>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
