<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Request Aganze employer verification"><title>Company verification | Aganze</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script defer src="supabase-app.js"></script></head>
<body data-page="company-verification" data-auth-required><header class="site-header"><a class="brand" href="index.html">Aganze NetworkTalent</a><nav><a href="company-dashboard.html">Dashboard</a><button data-logout type="button">Log out</button></nav></header><main class="section"><p class="eyebrow">EMPLOYER TRUST</p><h1>Verify your company</h1><p>Verification helps candidates know who is contacting them. Submit information that our team can check. Your account will remain restricted until review is complete.</p><form class="form-card" data-supabase="company-verification"><label>Legal company name<input name="legal_name" required minlength="2" maxlength="200"></label><label>Company website<input name="website" type="url" required maxlength="500" placeholder="https://example.com"></label><label>Registration or incorporation number<input name="registration_number" maxlength="160"></label><label>Business email<input name="business_email" type="email" required maxlength="320"></label><label>Why should candidates trust this account?<textarea name="explanation" required minlength="20" maxlength="3000"></textarea></label><button class="button" type="submit">Submit for review</button></form><section data-verification-status><p>Loading submission status…</p></section></main></body></html>
