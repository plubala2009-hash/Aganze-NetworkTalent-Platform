<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse verified candidates and practical evidence.">
  <title>Talent feed | Aganze</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script defer src="supabase-app.js"></script>
</head>
<body data-page="talent-feed" data-auth-required>
  <header class="site-header">
    <a class="brand" href="index.html">Aganze NetworkTalent</a>
    <nav>
      <a href="company-dashboard.html">Dashboard</a>
      <a href="company-verification.html">Verification</a>
      <button type="button" data-logout>Log out</button>
    </nav>
  </header>

  <main class="section">
    <p class="eyebrow">VERIFIED TALENT</p>
    <h1>Browse people by proven skills.</h1>
    <div class="trust-legend">
      <span class="trust-badge success">Verified</span>
      <span class="trust-badge warning">Pending review</span>
      <span class="trust-badge error">Rejected</span>
    </div>
    <div class="cards three" data-talent-list>
      <p>Loading candidates…</p>
    </div>
  </main>
</body>
</html>
